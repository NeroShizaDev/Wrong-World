name: Build Android Debug APK

on:
  workflow_dispatch: # Ручной запуск: Actions → Build Android Debug APK → Run workflow
  push:
    branches:
      - '**' # Автоматический запуск при пуше в любую ветку репозитория

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true # Арт и музыка лежат в Git LFS, без этого в APK попадут 130-байтовые указатели

      - name: Verify Git LFS assets
        run: |
          if git lfs ls-files | grep -E '^[0-9a-f]+ - '; then
            echo "::error::Эти файлы остались указателями Git LFS, а не настоящими ассетами"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # Electron нужен только для PC-сборки
        run: |
          npm ci || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev

      - name: Build Web Application (React/Vite)
        run: |
          npm run build
          ls -l dist/assets # Размеры ассетов в логе: png и mp3 должны весить мегабайты

      - name: Initialize Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Web Assets to Native Android
        run: npx cap sync android

      - name: Upgrade Gradle Wrapper to 8.5
        run: |
          sed -i 's/gradle-8.2.1/gradle-8.5/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Target Android SDK 35
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' android/variables.gradle

      - name: Exclude duplicate Kotlin modules
        run: |
          echo "subprojects { configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' } }" >> android/build.gradle
          echo "subprojects { configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7' } }" >> android/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
